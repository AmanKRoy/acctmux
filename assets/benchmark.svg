<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">acctmux memory benchmark: four real Google accounts</title>
<desc id="desc">Aggregate process-tree PSS at eight client sessions and four real logged-in Google accounts, measured 2026-10-26. Stock stdio 4938 MB, supergateway 5371 MB, mcp-proxy 1166 MB, acctmux 778 MB, workspace-mcp native HTTP 140 MB, and workspace-mcp behind acctmux 562 MB.</desc>
<rect width="1200" height="430" rx="20" fill="#0d1422"/><g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="48" y="45" fill="#f8fafc" font-size="26" font-weight="700">Memory at 8 sessions × 4 real accounts</text>
<text x="48" y="73" fill="#9fb0c8" font-size="14">Aggregate process-tree PSS · Google Workspace MCP · 2026-10-26</text>
<text x="48" y="119" fill="#c4d1e2" font-size="15">Stock stdio</text><rect x="290" y="99" width="650" height="25" rx="6" fill="#475569"/><text x="954" y="118" fill="#e2e8f0" font-size="15">4,938 MB · 32 processes</text>
<text x="48" y="166" fill="#c4d1e2" font-size="15">supergateway</text><rect x="290" y="146" width="707" height="25" rx="6" fill="#475569"/><text x="1011" y="165" fill="#e2e8f0" font-size="15">5,371 MB · 36</text>
<text x="48" y="213" fill="#c4d1e2" font-size="15">mcp-proxy</text><rect x="290" y="193" width="153" height="25" rx="6" fill="#64748b"/><text x="457" y="212" fill="#e2e8f0" font-size="15">1,166 MB · 8</text>
<text x="48" y="260" fill="#a7f3d0" font-size="15" font-weight="700">acctmux</text><rect x="290" y="240" width="102" height="25" rx="6" fill="#1b8b77"/><text x="406" y="259" fill="#a7f3d0" font-size="15" font-weight="700">778 MB · 5</text>
<text x="48" y="307" fill="#c4d1e2" font-size="15">workspace-mcp behind acctmux</text><rect x="290" y="287" width="74" height="25" rx="6" fill="#64748b"/><text x="378" y="306" fill="#e2e8f0" font-size="15">562 MB · 5</text>
<text x="48" y="354" fill="#c4d1e2" font-size="15">workspace-mcp native HTTP</text><rect x="290" y="334" width="18" height="25" rx="6" fill="#64748b"/><text x="322" y="353" fill="#e2e8f0" font-size="15">140 MB · 1</text>
<text x="48" y="402" fill="#9fb0c8" font-size="13">Real logged-in accounts; two repetitions per cell. See docs/benchmarks/2026-10-26.md for method and caveats.</text>
</g></svg>