<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">acctmux architecture</title><desc id="desc">MCP clients connect to one local HTTP endpoint. Bearer auth and request checks protect the endpoint. acctmux combines tool surfaces, applies account policy and optional pool selection, then routes to lazy account-specific stdio workers.</desc>
<defs><linearGradient id="router" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153c49"/><stop offset="1" stop-color="#1c5a62"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#8ca3b8"/></marker></defs>
<rect width="1200" height="690" rx="20" fill="#0d1422"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="54" y="52" fill="#f8fafc" font-size="28" font-weight="700">One endpoint. Account-aware routing.</text><text x="54" y="82" fill="#9fb0c8" font-size="15">MCP clients see one server; acctmux manages upstream processes and account boundaries.</text>
<rect x="50" y="130" width="220" height="128" rx="14" fill="#172235" stroke="#43546c"/><text x="72" y="163" fill="#f8fafc" font-size="18" font-weight="700">Coding agents</text><text x="72" y="192" fill="#c4d1e2" font-size="14">Claude Code</text><text x="72" y="214" fill="#c4d1e2" font-size="14">OpenCode · Codex</text><text x="72" y="236" fill="#c4d1e2" font-size="14">Other MCP clients</text>
<path d="M270 194H328" stroke="#8ca3b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="178" fill="#9fb0c8" text-anchor="middle" font-size="12">HTTP</text>
<rect x="338" y="120" width="470" height="148" rx="16" fill="url(#router)" stroke="#71f3c7" stroke-width="1.5"/><text x="364" y="155" fill="#f8fafc" font-size="22" font-weight="700">acctmux</text><text x="364" y="181" fill="#b7f7e2" font-size="14">[::1]:18704/mcp · bearer token optional</text><text x="364" y="210" fill="#d4e5ee" font-size="14">Combined tools · prompts · resources</text><text x="364" y="237" fill="#d4e5ee" font-size="14">Account selector · policy · pool selection</text>
<path d="M573 268V316" stroke="#8ca3b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="591" y="297" fill="#9fb0c8" font-size="12">validate / route</text>
<rect x="240" y="328" width="666" height="76" rx="12" fill="#182338" stroke="#43546c"/><text x="573" y="357" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Account and pool router</text><text x="573" y="382" text-anchor="middle" fill="#b9c7d8" font-size="13">Explicit account selection · allow/deny policy · configured quota failover</text>
<path d="M573 404V433H210V455M573 433V455M573 433H990V455" fill="none" stroke="#8ca3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="466" width="320" height="112" rx="13" fill="#172235" stroke="#43546c"/><text x="74" y="498" fill="#a7f3d0" font-size="16" font-weight="700">Google · work</text><text x="74" y="526" fill="#e2e8f0" font-size="14">stdio child process</text><text x="74" y="550" fill="#9fb0c8" font-size="13">Isolated credentials and profile</text>
<rect x="413" y="466" width="320" height="112" rx="13" fill="#172235" stroke="#43546c"/><text x="437" y="498" fill="#bae6fd" font-size="16" font-weight="700">Notion · personal</text><text x="437" y="526" fill="#e2e8f0" font-size="14">stdio child process</text><text x="437" y="550" fill="#9fb0c8" font-size="13">Per-account tool restrictions</text>
<rect x="776" y="466" width="374" height="112" rx="13" fill="#172235" stroke="#43546c"/><text x="800" y="498" fill="#ddd6fe" font-size="16" font-weight="700">Tavily · key pool</text><text x="800" y="526" fill="#e2e8f0" font-size="14">One worker per selected member</text><text x="800" y="550" fill="#9fb0c8" font-size="13">Optional quota-aware failover</text>
<rect x="50" y="612" width="1100" height="42" rx="9" fill="#251e31" stroke="#8b5cf6" stroke-opacity=".65"/><text x="600" y="638" text-anchor="middle" fill="#ddd6fe" font-size="13">Trust boundary: loopback or Unix socket · use bearer auth on shared machines · do not expose directly to a network</text></g></svg>