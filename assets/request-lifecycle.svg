<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">acctmux request lifecycle</title><desc id="desc">A client selects an account, acctmux validates the request and applies policy or pool routing, starts or reuses a worker, forwards the call, and returns the result. Idle workers are stopped after a timeout.</desc>
<rect width="1200" height="330" rx="18" fill="#0d1422"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="48" fill="#f8fafc" font-size="25" font-weight="700">From account selector to upstream result</text>
<rect x="48" y="85" width="242" height="150" rx="14" fill="#172235" stroke="#43546c"/><text x="70" y="118" fill="#80d9ff" font-size="13" font-weight="700">01 · SELECT</text><text x="70" y="151" fill="#f8fafc" font-size="18" font-weight="700">Choose identity</text><text x="70" y="180" fill="#c4d1e2" font-size="14">account = work</text><text x="70" y="204" fill="#9fb0c8" font-size="13">Or choose a configured pool</text>
<path d="M290 160h36l-8-7m8 7-8 7" fill="none" stroke="#8ca3b8" stroke-width="2.5"/>
<rect x="336" y="85" width="242" height="150" rx="14" fill="#173a48" stroke="#71f3c7"/><text x="358" y="118" fill="#a7f3d0" font-size="13" font-weight="700">02 · AUTHORIZE</text><text x="358" y="151" fill="#f8fafc" font-size="18" font-weight="700">Check &amp; route</text><text x="358" y="180" fill="#d4e5ee" font-size="14">Bearer / request checks</text><text x="358" y="204" fill="#d4e5ee" font-size="13">Tool policy / pool strategy</text>
<path d="M578 160h36l-8-7m8 7-8 7" fill="none" stroke="#8ca3b8" stroke-width="2.5"/>
<rect x="624" y="85" width="242" height="150" rx="14" fill="#172235" stroke="#43546c"/><text x="646" y="118" fill="#ddd6fe" font-size="13" font-weight="700">03 · EXECUTE</text><text x="646" y="151" fill="#f8fafc" font-size="18" font-weight="700">Start or reuse</text><text x="646" y="180" fill="#c4d1e2" font-size="14">One stdio child per account</text><text x="646" y="204" fill="#9fb0c8" font-size="13">Concurrent calls share worker</text>
<path d="M866 160h36l-8-7m8 7-8 7" fill="none" stroke="#8ca3b8" stroke-width="2.5"/>
<rect x="912" y="85" width="240" height="150" rx="14" fill="#172235" stroke="#43546c"/><text x="934" y="118" fill="#fcd34d" font-size="13" font-weight="700">04 · CLEAN UP</text><text x="934" y="151" fill="#f8fafc" font-size="18" font-weight="700">Return &amp; idle</text><text x="934" y="180" fill="#c4d1e2" font-size="14">Forward result to client</text><text x="934" y="204" fill="#9fb0c8" font-size="13">Stop worker after timeout</text>
<text x="48" y="280" fill="#9fb0c8" font-size="14">Quota failover is opt-in and limited to explicitly configured tools that are safe to retry.</text></g></svg>